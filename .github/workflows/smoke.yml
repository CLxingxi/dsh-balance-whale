name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  widget:
    name: widget smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Run the widget smoke suite
        run: node tools/balance-whale-smoke.mjs

  skins:
    name: skin assets check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Pillow + numpy
        run: pip install --quiet pillow numpy
      - name: Validate every skin manifest and image
        run: python tools/prepare-skins.py --check
